name: PW-REMOTE-D measurement originals
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Observed D-T02 run IDs and attempts as JSON pairs"
        required: true
        type: string
      observations:
        description: "Base64 of the original scoped local observation ledgers"
        required: true
        type: string
permissions: {}
jobs:
  evidence:
    if: github.repository == 'venomenon328/picross-remote-test' && github.repository_id == '1470169013'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read the compared product revisions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: venomenon328/picross
          ref: 26b00c6a49abc868f5207bad6193ff993a4e54b8
          fetch-depth: 3
          persist-credentials: false
      - name: Collect only scoped D-T02 attempt metadata and original logs
        env:
          GH_TOKEN: ${{ github.token }}
          D_RUNS: ${{ inputs.runs }}
          D_OBSERVATIONS: ${{ inputs.observations }}
        run: |
          python3 -B - <<'PY'
          import concurrent.futures
          import base64
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess
          from tools.production_workspace import payload

          def output(*args, data=None):
              return subprocess.check_output(args, input=data)

          repo = os.environ['GITHUB_REPOSITORY']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pw-d-measurements'
          out.mkdir()
          pins = ('b3f69ffc878d1723355d7c7819b9f434ea5660d2', '26b00c6a49abc868f5207bad6193ff993a4e54b8')
          assert output('git','rev-parse','HEAD~2','HEAD').decode().split() == list(pins)
          def inputs(pin, app):
              method = payload.pw_method_files(lambda path: output('git','show',pin+':'+path)) if app == payload.PW else set()
              paths = []
              for raw in output('git','ls-tree','-rz',pin).split(b'\0'):
                  if raw:
                      metadata, name = raw.split(b'\t',1)
                      if payload.selected(name.decode(), app=app, method_files=method):
                          mode, kind, oid = metadata.decode().split()
                          assert kind == 'blob'
                          paths.append((name.decode(), mode, oid))
              files = []
              stream = io.BytesIO(output('git','cat-file','--batch',data=''.join(oid+'\n' for _,_,oid in paths).encode()))
              for name, mode, oid in paths:
                  actual, kind, size = stream.readline().split()
                  assert actual.decode() == oid and kind == b'blob'
                  data = stream.read(int(size))
                  assert stream.read(1) == b'\n'
                  files.append(dict(file=name, mode=mode, bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
              return dict(files=files, fingerprint=hashlib.sha256(payload.canonical(files)).hexdigest())

          inventories = [{app.key: inputs(pin,app) for app in (payload.PW,payload.PE,payload.PG)} for pin in pins]
          for pin, inventory in zip(pins,inventories,strict=True):
              (out/(pin+'-inventory.json')).write_bytes(payload.canonical(dict(commit=pin,products=inventory)))
          assert inventories[0] == inventories[1]

          rows = json.loads(os.environ['D_RUNS'])
          assert isinstance(rows,list) and 0 < len(rows) <= 40
          def save(row):
              run, attempt = row
              assert type(run) is int and run > 0 and type(attempt) is int and 0 < attempt <= 5
              name = f'{run}-attempt-{attempt}'
              path = f'repos/{repo}/actions/runs/{run}/attempts/{attempt}'
              metadata = output('gh','api',path)
              data = json.loads(metadata)
              assert (data['id'],data['run_attempt'],data['status']) == (run,attempt,'completed')
              assert data['repository']['id'] == data['head_repository']['id'] == 1470169013
              assert data['path'] in ('.github/workflows/pw-remote.yml','.github/workflows/work-growth.yml')
              assert 'work-prod-control/remote/pz-remote-d-t02/' in (data['display_title']+' '+data['head_branch'])
              (out/(name+'-run.json')).write_bytes(metadata)
              (out/(name+'-jobs.json')).write_bytes(output('gh','api',path+'/jobs?per_page=100'))
              (out/(name+'-logs.zip')).write_bytes(output('gh','api',path+'/logs'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(save,rows))
          observations = json.loads(os.environ['D_OBSERVATIONS'])
          assert set(observations) == {'baseline-ledger.json','d-ledger.json','recovery-ledger.json',
                                       'failed-delivery.json','raster-equivalence.json'}
          for name, encoded in observations.items():
              data = base64.b64decode(encoded, validate=True)
              assert isinstance(json.loads(data), (dict,list))
              (out/name).write_bytes(data)
          contents = {f.name:dict(bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in out.iterdir()}
          (out/'sha256.json').write_bytes(payload.canonical(dict(files=contents)))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pw-remote-d-measurement-originals
          path: ${{ runner.temp }}/pw-d-measurements/
          if-no-files-found: error
          retention-days: 7
